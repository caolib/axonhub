name: Sync Model Developers

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: unstable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Fetch and filter model developers data
        run: |
          node scripts/sync/sync-model-developers.js

      - name: Commit and push
        run: |
          if git diff --quiet frontend/src/features/models/data/providers.json; then
            echo "No changes in providers.json, nothing to push."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/models/data/providers.json
          git commit -m 'chore: sync model developers data'

          # Rebase in case unstable moved while this job was running.
          git pull --rebase --autostash origin unstable
          git push origin HEAD:unstable
